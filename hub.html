<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{common.productName}}</title>
<link rel="icon" href="/favicon.png">
<!-- Coulisses (formerly « Brambleshire Studio ») — home screen of the app: the episodes and the imported projects, open one in the review studio
     (same « glass » design). « Importer un projet… » works like DaVinci Resolve's Project Manager: a folder (an AItelier
     run, a folder of videos) or a video file joins the list; removing it from the list deletes nothing. -->
<style>
  :root {
    --s12: #f4f5fa; --s11: #aeb2c4; --s9: #6f748a; --stroke: rgba(255,255,255,.075); --stroke-2: rgba(255,255,255,.14);
    --lime: #c9f26b; --mint: #6fe7c8; --violet: #b49cff; --sky: #8fcdff; --coral: #ff8f7e; --amber: #ffd27f;
    --grad-lime: linear-gradient(135deg, #dcf77a 0%, #9dee9a 48%, #6fe2c9 100%);
    --font: "Inter", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; --font-d: "Outfit", "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; color: var(--s12); font: 13.5px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
  body { background:
      radial-gradient(900px 620px at 8% -8%, rgba(140,110,255,.30), transparent 62%),
      radial-gradient(760px 560px at 102% 12%, rgba(90,210,255,.16), transparent 60%),
      radial-gradient(900px 640px at 70% 118%, rgba(110,231,200,.18), transparent 60%),
      radial-gradient(700px 500px at -6% 96%, rgba(247,168,207,.12), transparent 60%), #090b12; background-attachment: fixed; }
  header { display: flex; align-items: center; gap: 14px; padding: 26px 40px 6px; }
  .logo { width: 44px; height: 44px; border-radius: 14px; background: var(--grad-lime); display: grid; place-items: center; color: #10140a; font: 700 22px var(--font-d); box-shadow: 0 10px 28px rgba(150,230,140,.28); }
  h1 { margin: 0; font: 600 26px var(--font-d); letter-spacing: .005em; }
  .sub { color: var(--s9); font-size: 13px; }
  header .grow { flex: 1; }
  .pill { display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 14px; border-radius: 999px; background: rgba(24,27,40,.58); backdrop-filter: blur(20px); border: 1px solid var(--stroke); color: var(--s11); font: 500 12.5px var(--font-d); }
  .pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--lime); box-shadow: 0 0 10px var(--lime); }
  main { padding: 18px 40px 50px; }
  h2 { font: 600 15px var(--font-d); color: var(--s11); margin: 8px 4px 16px; letter-spacing: .02em; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 18px; }
  .card { position: relative; border-radius: 24px; overflow: hidden; background: rgba(24,27,40,.58); backdrop-filter: saturate(160%);   /* (no blur: see page/studio.css .glass) */ border: 1px solid var(--stroke);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.06), 0 24px 60px rgba(0,0,0,.35); cursor: pointer; transition: transform .18s, border-color .18s, box-shadow .18s; }
  .card:hover { transform: translateY(-3px); border-color: rgba(201,242,107,.45); box-shadow: 0 0 0 4px rgba(201,242,107,.06), 0 30px 70px rgba(0,0,0,.45); }
  .card.off { cursor: default; opacity: .55; } .card.off:hover { transform: none; border-color: var(--stroke); }
  .thumb { aspect-ratio: 16 / 9; background: #000 center / cover no-repeat; position: relative; }
  .thumb::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 55%, rgba(9,11,18,.75)); }
  .id { position: absolute; left: 14px; top: 14px; z-index: 1; height: 26px; padding: 0 11px; border-radius: 999px; display: inline-flex; align-items: center; background: rgba(9,11,18,.6); backdrop-filter: blur(10px); font: 600 12px var(--font-d); border: 1px solid var(--stroke-2); }
  .live { position: absolute; right: 14px; top: 14px; z-index: 1; height: 26px; padding: 0 11px; border-radius: 999px; display: inline-flex; align-items: center; gap: 7px; background: var(--lime); color: #10140a; font: 600 11.5px var(--font-d); }
  .body { padding: 16px 18px 18px; }
  .title { font: 600 19px var(--font-d); margin: 0 0 4px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  /* the project's engine, next to its title (user request, 09/10/2026): Remotion or HyperFrames */
  .eng { height: 20px; padding: 0 8px; border-radius: 6px; display: inline-flex; align-items: center; font: 600 10.5px var(--font-d); letter-spacing: .02em; border: 1px solid var(--stroke-2); white-space: nowrap; }
  .eng.remotion { color: #8fb8ff; background: rgba(110, 150, 255, 0.12); border-color: rgba(110, 150, 255, 0.3); }
  .eng.hyperframes { color: #ffb38a; background: rgba(255, 150, 100, 0.12); border-color: rgba(255, 150, 100, 0.3); }
  .meta { color: var(--s9); font-size: 12.5px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
  .chip { height: 24px; padding: 0 10px; border-radius: 999px; display: inline-flex; align-items: center; font: 600 11.5px var(--font-d); background: rgba(255,255,255,.08); color: var(--s11); }
  .chip.open { background: rgba(255,143,126,.15); color: var(--coral); }
  .chip.ok { background: rgba(111,231,200,.14); color: var(--mint); }
  .chip.draft { background: rgba(180,156,255,.16); color: #c9bdff; }
  .chip.render { background: var(--grad-lime); color: #10140a; }
  .chip.renderbad { background: rgba(255,143,126,.15); color: var(--coral); }
  .row { display: flex; align-items: center; margin-top: 16px; gap: 10px; }
  .row .grow { flex: 1; }
  button { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 20px; border: 0; border-radius: 999px; background: var(--grad-lime); color: #10140a; font: 600 13.5px var(--font-d); cursor: pointer; box-shadow: 0 10px 28px rgba(150,230,140,.22); }
  button:hover { filter: brightness(1.06); }
  button:disabled { opacity: .6; cursor: default; }
  .spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid rgba(16,20,10,.25); border-top-color: #10140a; animation: r .8s linear infinite; }
  @keyframes r { to { transform: rotate(360deg); } }
  .err { color: var(--coral); font-size: 12.5px; margin-top: 10px; white-space: pre-wrap; }
  .empty { color: var(--s9); padding: 60px 0; text-align: center; }
  footer { color: var(--s9); font-size: 12px; padding: 0 44px 30px; }
  h2 { display: flex; align-items: center; gap: 10px; }
  h2 .n { font: 600 11px var(--font-d); color: var(--s9); }
  section + section { margin-top: 34px; }
  .kind { position: absolute; left: 14px; bottom: 12px; z-index: 1; height: 24px; padding: 0 10px; border-radius: 999px; display: inline-flex; align-items: center; background: rgba(9,11,18,.62); backdrop-filter: blur(10px); font: 600 11px var(--font-d); color: var(--sky); border: 1px solid var(--stroke-2); }
  .card .more { height: 32px; padding: 0 14px; border-radius: 999px; background: rgba(255,255,255,.06); color: var(--s11); box-shadow: none; font: 500 12px var(--font-d); border: 1px solid var(--stroke); }
  .card .more:hover { color: var(--coral); border-color: rgba(255,143,126,.35); background: rgba(255,143,126,.1); filter: none; }
  .card .body { position: relative; }
  .imp { border: 1.5px dashed rgba(201,242,107,.35); background: rgba(24,27,40,.35); cursor: default; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 26px 22px; min-height: 300px; gap: 10px; }
  .imp:hover { transform: none; border-color: rgba(201,242,107,.6); }
  .imp .plus { width: 54px; height: 54px; border-radius: 18px; display: grid; place-items: center; background: var(--grad-lime); color: #10140a; font: 600 30px/1 var(--font-d); box-shadow: 0 12px 30px rgba(150,230,140,.25); }
  .imp .t { font: 600 18px var(--font-d); }
  .imp .d { color: var(--s9); font-size: 12.5px; max-width: 300px; }
  .imp .btns { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 6px; }
  .imp .btns button.soft { background: rgba(255,255,255,.08); color: var(--s12); box-shadow: none; border: 1px solid var(--stroke-2); }
  .imp .paste { display: none; gap: 6px; width: 100%; margin-top: 4px; }
  .imp.pasting .paste { display: flex; }
  .imp .paste input { flex: 1; min-width: 0; height: 38px; border-radius: 999px; border: 1px solid var(--stroke-2); background: rgba(0,0,0,.3); color: var(--s12); padding: 0 14px; font: 12.5px var(--font); }
  .imp a { color: var(--s9); font-size: 12px; cursor: pointer; text-decoration: underline dotted; }
  .imp .err { max-width: 320px; }
  /* « Langue · Language »: the app's language, for the user (settings.json) */
  .langs { display: inline-flex; gap: 2px; padding: 3px; border-radius: 999px; background: rgba(24,27,40,.58); backdrop-filter: blur(20px); border: 1px solid var(--stroke); }
  .langs button { height: 26px; padding: 0 11px; border-radius: 999px; background: transparent; color: var(--s11); box-shadow: none; font: 600 11.5px var(--font-d); }
  .langs button.on { background: #f4f5fa; color: #11131c; }
  .langs button:disabled { opacity: .5; }
  body > #menubar { position: sticky; top: 0; }
  /* the folders (user request, 08/10/2026: « ranger les .coulisses par dossier »): one section each, folded or not */
  .topbar { display: flex; align-items: center; gap: 10px; margin: 0 4px; }
  .topbar h2 { margin: 8px 0; }
  .topbar .grow { flex: 1; }
  /* « Mises à jour » (09/10/2026): the badge, the window */
  #updBtn { position: relative; }
  #updBtn .badge { display: none; min-width: 18px; height: 18px; padding: 0 5px; margin-left: 6px; border-radius: 999px; background: var(--lime); color: #10140a; font: 700 11px/18px var(--font-d); text-align: center; }
  #updBtn.todo .badge { display: inline-block; }
  .upd h3 { margin: 14px 0 6px; font: 600 15px var(--font-d); display: flex; align-items: center; gap: 8px; }
  .upd h3:first-child { margin-top: 0; }
  .upd .ln { display: flex; gap: 8px; align-items: baseline; font-size: 13px; color: var(--s11); margin: 4px 0; flex-wrap: wrap; }
  .upd .ok { color: var(--mint); font-weight: 600; } .upd .todo { color: var(--amber); font-weight: 600; }
  .upd .note { font-size: 12px; color: var(--s9); margin: 6px 0; line-height: 1.5; }
  .upd .acts { display: flex; gap: 8px; margin: 8px 0 4px; flex-wrap: wrap; }
  .upd .acts button { height: 30px; font-size: 12px; }
  .upd .log { white-space: pre-wrap; font: 11.5px/1.5 var(--mono, monospace); color: var(--s9); max-height: 160px; overflow: auto; background: rgba(0,0,0,.25); border-radius: 10px; padding: 8px 10px; margin-top: 8px; }
  .upd .log:empty { display: none; }
  .upd .foot { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--s9); margin-top: 14px; }
  button.soft { background: rgba(255,255,255,.08); color: var(--s12); box-shadow: none; border: 1px solid var(--stroke-2); }
  .folder { margin-top: 18px; }
  .folder > h2.fh { margin: 8px 4px 14px; user-select: none; }
  .fh .caret { width: 28px; height: 28px; padding: 0; justify-content: center; border-radius: 9px; background: transparent; box-shadow: none; color: var(--s11); font-size: 12px; }
  .fh .caret:hover { background: rgba(255,255,255,.08); filter: none; }
  .fh .fname { color: var(--s12); font: 600 17px var(--font-d); }
  .fh .grow { flex: 1; }
  .fh .fbtn { height: 28px; padding: 0 12px; font: 500 12px var(--font-d); background: transparent; color: var(--s9); box-shadow: none; border: 1px solid transparent; opacity: 0; transition: opacity .15s; }
  .folder:hover .fbtn, .fh .fbtn:focus { opacity: 1; }
  .fh .fbtn:hover { color: var(--s12); border-color: var(--stroke-2); filter: none; }
  .folder.closed > .grid { display: none; }
  .folder.drop > h2 { outline: 2px dashed rgba(201,242,107,.6); outline-offset: 6px; border-radius: 12px; }
  .folder.drop > .grid { outline: 2px dashed rgba(201,242,107,.35); outline-offset: 8px; border-radius: 26px; }
  .card .fold { height: 32px; padding: 0 13px; border-radius: 999px; background: rgba(255,255,255,.06); color: var(--s11); box-shadow: none; font: 500 12px var(--font-d); border: 1px solid var(--stroke); }
  .card .fold:hover { color: var(--s12); border-color: var(--stroke-2); filter: none; }
  .fmenu { position: fixed; z-index: 90; min-width: 230px; max-height: 60vh; overflow: auto; padding: 6px; border-radius: 14px; background: rgba(20,22,33,.97); border: 1px solid var(--stroke-2); box-shadow: 0 18px 50px rgba(0,0,0,.5); display: flex; flex-direction: column; }
  .fmenu button { height: 32px; justify-content: flex-start; background: transparent; color: var(--s12); box-shadow: none; border-radius: 9px; font: 500 12.5px var(--font); padding: 0 12px; }
  .fmenu button:hover { background: rgba(255,255,255,.08); filter: none; }
  .fmenu button.on { color: var(--lime); }
  .fmenu .sep { height: 1px; background: var(--stroke-2); margin: 4px 6px; }
  /* « Chercher les .coulisses » */
  .scan p { margin: 0 0 6px; }
  .scan .row2 { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 10px 0; }
  .scan .row2 .grow { flex: 1; }
  .scan .prog { color: var(--s11); font-size: 12.5px; display: flex; align-items: center; gap: 8px; }
  .scan .prog .spin { border-color: rgba(255,255,255,.2); border-top-color: var(--lime); }
  .scan .cur { color: var(--s9); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 4px; }
  .scan .list { max-height: 44vh; overflow: auto; margin-top: 6px; display: flex; flex-direction: column; gap: 2px; padding-right: 4px; }
  .scan .grp { font: 600 12.5px var(--font-d); color: var(--s12); margin: 10px 0 2px; }
  .scan label.it { display: flex; gap: 10px; align-items: flex-start; padding: 6px 8px; border-radius: 10px; cursor: pointer; }
  .scan label.it:hover { background: rgba(255,255,255,.05); }
  .scan label.it.off { cursor: default; opacity: .62; }
  .scan label.it input { margin-top: 3px; }
  .scan .tt { color: var(--s12); font-size: 13px; }
  .scan .ff { color: var(--s9); font-size: 11px; word-break: break-all; }
  .scan .bb { font: 600 10.5px var(--font-d); color: var(--sky); margin-left: 6px; }
  .scan .bb.bad { color: var(--coral); }
  .scan .res { color: var(--mint); font-size: 12.5px; }
  /* « Nouveau projet » */
  .np label { display: grid; grid-template-columns: 110px 1fr; align-items: center; gap: 10px; margin: 8px 0; color: var(--s11); font-size: 12.5px; }
  .np input, .np select { height: 36px; border-radius: 12px; border: 1px solid var(--stroke-2); background: rgba(0,0,0,.3); color: var(--s12); padding: 0 12px; font: 13px var(--font); }
  .np select option { background: #151826; }
  .np .seg { display: inline-flex; gap: 4px; }
  .np .seg button { height: 32px; padding: 0 14px; background: rgba(255,255,255,.06); color: var(--s11); box-shadow: none; border: 1px solid var(--stroke); font: 600 12px var(--font-d); }
  .np .seg button.on { background: #f4f5fa; color: #11131c; }
  .np .log { margin-top: 8px; max-height: 160px; overflow: auto; font: 11px/1.5 "Cascadia Mono", Consolas, monospace; color: var(--s9); white-space: pre-wrap; background: rgba(0,0,0,.25); border-radius: 10px; padding: 8px 10px; }
  .np .row2 { display: flex; gap: 8px; align-items: center; margin-top: 12px; }
  .np .row2 .grow { flex: 1; }
  .np .why { color: var(--coral); font-size: 12.5px; }
  body { background:#11151b; color:#e9eeee; --lime:#83e5c2; --s11:#b1bec4; --s9:#99a6ae; --stroke:#303942; --stroke-2:#414d54; --grad-lime:#83e5c2; }
  header,main,footer { max-width:1700px; margin-inline:auto; }
  header { padding:24px clamp(16px,3vw,46px) 18px; }
  main { padding:12px clamp(16px,3vw,46px) 42px; }
  .logo { color:var(--lime); width:38px; height:38px; background:#1a2927; border:1px solid #38544c; border-radius:8px; box-shadow:none; }
  .grid { grid-template-columns: repeat(auto-fill,minmax(min(290px,100%),1fr)); gap:12px; }
  .card { border-radius:8px; box-shadow:none; background:#1b2128; border-color:var(--stroke); }
  .card:hover { transform:none; box-shadow:none; border-color:#5d8278; }
  .thumb { background-color:#11171d; }
  .thumb.no-image { background:repeating-linear-gradient(128deg,#273c42 0 2px, transparent 2px 30px),linear-gradient(130deg,#182127,#25383b 58%,#1c282e); }
  .body { padding:12px; } .title { font:600 16px/1.4 var(--font); }
  .row { gap:5px; margin-top:12px; } .id,.kind,.chip,.live { border-radius:4px; }
  button, .card .more, .card .fold, .card .open, .fh .fbtn { border-radius:5px; box-shadow:none; height:32px; padding:0 10px; font:600 12px var(--font); }
  button:focus-visible,input:focus-visible,select:focus-visible { outline:2px solid #83e5c2; outline-offset:2px; }
  .topbar { flex-wrap:wrap; } .topbar h2 { color:#eef3f1; font:600 21px var(--font); }
  .lib-controls { display:flex; flex-wrap:wrap; align-items:center; gap:8px; padding:13px 0; margin:5px 3px 0; border-block:1px solid var(--stroke); }
  .lib-controls input,.lib-controls select { box-sizing:border-box; height:34px; min-width:0; color:#e7efed; background:#1b2228; border:1px solid var(--stroke-2); border-radius:5px; padding:0 9px; font:12px var(--font); }
  .lib-controls input { flex:1; max-width:450px; min-width:min(220px,100%); }
  .lib-controls button { color:#becbcd; border:1px solid var(--stroke-2); background:#1b2228; }
  .lib-controls button[aria-pressed=true] { color:#8de5c7; border-color:#557e70; background:#213731; }
  .lib-controls .lib-spacer { flex:1; } .lib-pin { position:absolute; right:8px; bottom:8px; z-index:2; width:30px; justify-content:center; background:#111820dd; color:white; font-size:15px; }
  .lib-pin[aria-pressed=true] { color:#83e5c2; }
  #backStudio[hidden] { display:none; }
  #folders.lib-list .grid { display:flex; flex-direction:column; gap:4px; }
  #folders.lib-list .card { display:flex; min-height:74px; }
  #folders.lib-list .thumb { width:115px; flex:none; aspect-ratio:auto; }
  #folders.lib-list .thumb .id,#folders.lib-list .thumb .kind { display:none; }
  #folders.lib-list .body { flex:1; min-width:0; display:grid; align-content:center; grid-template-columns:minmax(0,1fr) auto; gap:1px 14px; }
  #folders.lib-list .title,#folders.lib-list .meta,#folders.lib-list .err,#folders.lib-list .chips { grid-column:1; }
  #folders.lib-list .row { grid-column:2; grid-row:1/5; align-self:center; margin:0; }
  #folders.lib-list .chips { margin-top:3px; } .imp { min-height:205px; border:1px dashed #426459; border-radius:7px; }
  .imp .plus { border-radius:6px; box-shadow:none; width:34px; height:34px; font-size:23px; }
  @media(max-width:750px){ header {gap:8px;} header .sub {display:none;} .lib-controls .lib-spacer {display:none;} #folders.lib-list .thumb {width:70px;} #folders.lib-list .body { display:block; } #folders.lib-list .row {margin-top:8px;} .folder .fbtn {opacity:1;} }
</style>

</head>
<body data-product="{{common.productName}}">
<nav id="menubar"></nav>
<header class="app-head">
  <span class="logo" aria-hidden="true"><svg viewBox="0 0 30 26" width="27" height="24"><path fill="currentColor" d="m1 20 9-16h5L6 20zM10 20l9-16h5l-9 16zM19 20l7-12 3 5-4 7z"/></svg></span>
  <div><h1>{{common.productName}}</h1><div class="sub">{{hub.sub}}</div></div>
  <!-- inside a studio (its « Accueil »): the way back to it -->
  <button class="soft" id="backStudio" hidden></button>
  <span class="grow"></span>
  <span class="langs" id="langs" title="Langue · Language"><button data-l="fr">FR</button><button data-l="en">EN</button></span>
  <span class="pill" id="where"><span class="dot"></span>{{hub.where}}</span>
  <button id="newBtn" title="{{hub.new.buttonTitle}}"><span aria-hidden="true">＋</span>{{hub.new.button}}</button>
</header>
<div class="library-shell">
<aside id="libraryRail" class="library-rail" aria-label="{{hub.library.browse}}">
  <nav class="lib-nav" aria-label="{{hub.lib.tools}}">
    <h2>{{hub.library.browse}}</h2>
    <button id="allProjects" type="button"><span aria-hidden="true" class="nav-glyph">▦</span>{{hub.library.all}}<span class="nav-count"></span></button>
    <button id="favOnly" type="button" aria-pressed="false"><span aria-hidden="true" class="nav-glyph">☆</span>{{hub.lib.favorites}}<span class="nav-count"></span></button>
    <button id="openNotesOnly" type="button" aria-pressed="false"><span aria-hidden="true" class="nav-glyph">◉</span>{{hub.lib.todo}}<span class="nav-count"></span></button>
  </nav>
  <nav class="lib-dir-nav" aria-label="{{hub.library.folders}}"><h2>{{hub.library.folders}}</h2><div id="folderLinks"></div></nav>
  <section id="addSec"><h2>{{hub.add}}</h2><div id="pgrid"></div></section>
  <div class="rail-utils"><button class="soft" id="scanBtn" title="{{hub.scan.buttonTitle}}">{{hub.scan.button}}</button>
    <button class="soft" id="updBtn" title="{{hub.upd.buttonTitle}}">{{hub.upd.button}}<span class="badge" id="updN"></span></button></div>
</aside>
<main id="libraryMain">
  <div class="library-heading"><h1>{{hub.library.library}}</h1><span id="activeScope"></span><div class="reverse-actions"><button type="button" id="reverseOpen" class="soft" aria-haspopup="dialog"></button><button type="button" id="reconstructOpen" class="soft" aria-haspopup="dialog"></button></div><button type="button" id="libraryNavToggle" class="soft" aria-expanded="false" aria-controls="libraryRail">{{hub.library.browse}}</button></div>
  <section id="featuredProject" hidden aria-labelledby="featureTitle">
    <div class="feature-art"><img alt="" id="featureImage"><span class="feature-clapper" aria-hidden="true">▷</span></div>
    <div class="feature-info"><span id="featureState"></span><h2 id="featureTitle" class="title"></h2><div class="feature-meta" id="featureMeta"></div>
      <div class="feature-chips chips"></div><div class="feature-actions"><button class="open" id="featureOpen">{{hub.openStudio}}<span aria-hidden="true"> ↗</span></button><button class="soft" id="featureReverse" type="button" aria-haspopup="dialog" hidden></button></div><div class="err"></div></div>
  </section>
  <div class="topbar"><h2>{{hub.projects}} <span class="n" id="nproj"></span></h2></div>
  <div class="lib-controls" role="group" aria-label="{{hub.lib.tools}}">
    <input id="projectSearch" type="search" aria-label="{{hub.lib.find}}" placeholder="{{hub.lib.find}}">
    <span class="lib-spacer"></span>
    <select id="librarySort" aria-label="{{hub.lib.sort}}"><option value="default">{{hub.lib.default}}</option><option value="recent">{{hub.lib.recent}}</option><option value="title">{{hub.lib.title}}</option></select>
    <button id="libraryList" type="button" aria-pressed="false">{{hub.lib.list}}</button>
  </div>
  <div id="folders"><div class="empty">{{hub.loading}}</div></div>
  <footer id="foot"></footer>
</main>
</div>
<script src="/menubar.js"></script>
<script src="/shortcuts.js"></script>
<script src="/reverse-ui.js"></script>
<script src="/reconstruct-ui.js"></script>
<script>
(() => {
  const $ = (s) => document.querySelector(s);
  // the texts of this page, in the user's language (window.T, given by hub-server.mjs: lib/i18n.mjs)
  const I18N = window.__I18N ?? { lang: 'fr', dict: {} }, LANG = I18N.lang, T = window.T ?? ((k) => k);
  const reverseOptions = {
    language: LANG,
    reveal: revealImportedProject,
    openProject: async project => {
      await revealImportedProject(project);
      const selected = library.find(entry => entry.id === project.id);
      if (selected) await openEp(selected, $('#featuredProject'));
    },
  };
  const reverse = window.createReverseEditor(reverseOptions);
  const reconstruction = window.createReconstructionEditor(reverseOptions);
  $('#reverseOpen').textContent = reverse.label;
  $('#reverseOpen').onclick = () => reverse.open();
  $('#reconstructOpen').textContent = reconstruction.label;
  $('#reconstructOpen').onclick = () => reconstruction.open();
  const LOC = LANG === 'fr' ? [] : 'en-US', TLOC = LANG === 'fr' ? [] : 'en-GB';   // French: the browser's own formats, as before
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const dur = (s) => (s ? `${Math.floor(s / 60)}:${String(Math.round(s % 60)).padStart(2, '0')}` : '');
  const day = (iso) => { const d = new Date(iso); return isNaN(d) ? '' : d.toLocaleDateString(LOC, { day: '2-digit', month: 'short' }) + ' ' + d.toLocaleTimeString(TLOC, { hour: '2-digit', minute: '2-digit' }); };
  let busy = null, last = '';
  const KIND = { aitelier: 'AItelier', folder: T('hub.kind.folder'), video: T('hub.kind.video'), remotion: 'Remotion', run: 'Run' };
  // a run of a Remotion pipeline (.coulisses) opens on its code, before any export
  const openable = (e) => !e.missing && (!!e.video || e.kind === 'remotion' || e.kind === 'hyperframes');
  const engineTag = (e) => (e.engine ? `<span class="eng ${e.engine}" title="${esc(T('hub.engine.title', { e: T('hub.engine.' + e.engine) }))}">${esc(T('hub.engine.' + e.engine))}</span>` : '');
  const kindOf = (e) => (e.kind === 'run' ? (e.channel || 'Run') : e.kind === 'remotion' ? `${e.channel || 'Remotion'}${e.video ? '' : T('hub.liveCode')}` : e.kind === 'hyperframes' ? `${e.channel || 'HyperFrames'}${e.video ? '' : T('hub.liveCode')}` : e.kind === 'aitelier' ? `AItelier${e.format ? ' · ' + (e.format === 'short' ? 'Short' : T('hub.long')) : ''}` : KIND[e.kind] ?? T('hub.kind.project'));
  function chipsOf(e) {
    const R = e.render;
    return [
      R ? (R.state === 'running' ? `<span class="chip render">${R.pct != null ? T('hub.chip.renderPct', { pct: R.pct }) : R.phase === 'checks' ? T('hub.chip.checks') : R.phase === 'finish' ? T('hub.chip.finish') : T('hub.chip.preparing')}</span>`
        : R.state === 'rendered' ? `<span class="chip render">${T('hub.chip.ready')}</span>` : `<span class="chip renderbad">${R.state === 'blocked' ? T('hub.chip.blocked') : T('hub.chip.failed')}</span>`) : '',
      e.notes ? `<span class="chip">${T('hub.chip.notes', { n: e.notes })}</span>` : '',
      e.open ? `<span class="chip open">${T('hub.chip.open', { n: e.open })}</span>` : (e.notes ? `<span class="chip ok">${T('hub.chip.allFixed')}</span>` : ''),
      e.drafts ? `<span class="chip draft">${T('hub.chip.drafts', { n: e.drafts })}</span>` : '',
      e.lots ? `<span class="chip">${T('hub.chip.lots', { n: e.lots })}</span>` : '',
    ].join('');
  }
  function card(e) {
    const c = document.createElement('div'); c.className = 'card' + (openable(e) ? '' : ' off'); c.dataset.id = e.id;
    const what = e.project ? (e.video ? T('hub.exported', { day: esc(day(e.video.mtime)) }) : e.missing ? T('hub.missingFolder') : e.kind === 'remotion' || e.kind === 'hyperframes' ? T('hub.notExported') : e.kind === 'run' ? T('hub.waitingExport') : T('hub.noVideo')) : (e.video ? T('hub.rendered', { day: esc(day(e.video.mtime)) }) : T('hub.notRendered'));
    c.innerHTML = `<div class="thumb">${e.thumb ? `<img loading="lazy" decoding="async" alt="" src="${thumbUrl(e)}">` : ''}<span class="id">${esc(e.project ? (e.missing ? T('hub.badge.missing') : T('hub.badge.project')) : e.id)}</span>${e.studio && !e.studio.paused ? `<span class="live">${T('hub.badge.open')}</span>` : ''}${e.project && !e.missing ? `<span class="kind">${esc(kindOf(e))}</span>` : ''}</div>
      <div class="body"><div class="title"><span>${esc(e.title)}</span>${e.missing ? '' : engineTag(e)}</div>
        <div class="meta">${[e.video ? dur(e.duration) : '', what, e.reviewed ? T('hub.reviewed', { day: esc(day(e.reviewed)) }) : ''].filter(Boolean).join(' · ')}</div>
        ${e.project ? `<div class="meta" title="${esc(e.root ?? e.revue)}" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(e.root ?? e.why ?? '')}</div>` : ''}
        <div class="chips">${chipsOf(e)}</div>
        <div class="row"><button class="fold" title="${esc(T('hub.folder.moveTitle'))}">${T('hub.folder.move')}</button>${e.project ? `<button class="more" title="${esc(T('hub.removeTitle'))}">${T('hub.remove')}</button>` : ''}<span class="grow"></span><button class="open" ${openable(e) ? '' : 'disabled'}>${T('hub.openStudio')}</button></div>
        <div class="err"></div></div>`;
    const thumb = c.querySelector('.thumb'); thumb.classList.toggle('no-image', !e.thumb);
    const preview = document.createElement('button'); preview.className = 'lib-preview';
    preview.title = T('hub.library.preview') + ' · ' + e.title; preview.setAttribute('aria-label', preview.title);
    preview.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3-6.5 10-6.5S22 12 22 12s-3 6.5-10 6.5S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>';
    preview.onclick = ev => { ev.stopPropagation(); previewId = e.id; drawLibrary(); $('#featureOpen').focus({preventScroll:true}); $('#featuredProject').scrollIntoView({block:'nearest'}); };
    thumb.append(preview);
    const image = thumb.querySelector('img');
    if (image) image.onerror = () => {image.hidden = true; thumb.classList.add('no-image');};
    const pin = document.createElement('button'); pin.className = 'lib-pin';
    const pinned = favorites.has(e.id);
    pin.textContent = pinned ? '★' : '☆';
    pin.setAttribute('aria-pressed', String(pinned)); pin.title = T(pinned ? 'hub.lib.unpin' : 'hub.lib.pin');
    pin.setAttribute('aria-label', pin.title + ' · ' + e.title); thumb.append(pin);
    pin.onclick = ev => {
      ev.stopPropagation(); if (favorites.has(e.id)) favorites.delete(e.id); else favorites.add(e.id);
      store.set('favorites', [...favorites]); drawLibrary();
      const focus = [...$('#folders').querySelectorAll('.card')].find(x => x.dataset.id === e.id)?.querySelector('.lib-pin') || $('#favOnly');
      focus.focus({preventScroll:true});
    };
    c.addEventListener('click', (ev) => { if (!ev.target.closest('.more, .fold, .lib-pin, .lib-preview')) openEp(e, c); });
    c.querySelector('.fold').addEventListener('click', (ev) => { ev.stopPropagation(); folderMenu(e, ev.currentTarget); });
    c.draggable = true;
    c.addEventListener('dragstart', (ev) => { ev.dataTransfer.setData('text/coulisses-id', e.id); ev.dataTransfer.effectAllowed = 'move'; });
    c.querySelector('.more')?.addEventListener('click', async (ev) => {
      ev.stopPropagation();
      if (!confirm(T('hub.removeConfirm', { title: e.title, revue: e.revue }))) return;
      await fetch('/api/remove?ep=' + e.id, { method: 'POST' }); last = ''; load(true);
    });
    return c;
  }
  // « Importer un projet » : the Windows dialog (a folder, or a video), or a pasted path
  function importCard() {
    const c = document.createElement('div'); c.className = 'card imp';
    c.innerHTML = `<div class="plus">+</div><div class="t">${T('hub.import.title')}</div>
      <div class="d">${T('hub.import.what')}</div>
      <div class="btns"><button id="impFolder">${T('hub.import.folder')}</button><button class="soft" id="impVideo">${T('hub.import.video')}</button></div>
      <button type="button" class="linkish" id="impPaste">${T('hub.import.paste')}</button>
      <div class="paste"><input id="impPath" placeholder="${esc(T('hub.import.placeholder'))}" spellcheck="false"><button id="impGo">${T('hub.import.go')}</button></div>
      <div class="err" id="impErr"></div>`;
    const err = (m) => { c.querySelector('#impErr').textContent = m || ''; };
    const doImport = async (p) => {
      err('');
      const r = await (await fetch('/api/import', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ path: p }) })).json().catch(() => null);
      if (!r?.ok) { err(r?.why ?? T('hub.import.failed')); return; }
      await revealImportedProject(r.project);
    };
    const pickAnd = async (what, b) => {
      err(''); const t = b.textContent; b.disabled = true; b.innerHTML = `<span class="spin"></span>${T('hub.import.dialogOpen')}`;
      try {
        const r = await (await fetch('/api/import/pick', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ what }) })).json();
        if (r.ok) await doImport(r.path); else if (!r.cancelled) err(r.why ?? T('hub.import.noDialog'));
      } catch { err(T('hub.import.noDialog')); }
      b.disabled = false; b.textContent = t;
    };
    c.querySelector('#impFolder').onclick = (e) => pickAnd('folder', e.currentTarget);
    c.querySelector('#impVideo').onclick = (e) => pickAnd('video', e.currentTarget);
    c.querySelector('#impPaste').onclick = () => { c.classList.add('pasting'); c.querySelector('#impPath').focus(); };
    const go = () => { const v = c.querySelector('#impPath').value.trim(); if (v) doImport(v); };
    c.querySelector('#impGo').onclick = go;
    c.querySelector('#impPath').addEventListener('keydown', (e) => { if (e.key === 'Enter') go(); });
    return c;
  }
  // inside a studio (its « Accueil », page/studio/09-keys-menus.js): a project opens in the whole window — the studio's own
  // just closes the home screen, at once; « Revenir au studio » and Échap too
  const inStudioFrame = (() => { try { return window.top !== window; } catch { return true; } })();
  function goTo(url) {
    if (inStudioFrame) { try { window.top.postMessage({ coulisses: 'open', url: new URL(url, location.href).href }, '*'); busy = null; load(true); return; } catch { /* the window itself, then */ } }
    location.href = url;
  }
  const backToStudio = () => { try { window.top.postMessage({ coulisses: 'close' }, '*'); } catch { /* */ } };
  if (inStudioFrame) {
    const b = $('#backStudio'), w = T('hub.backStudio');
    b.textContent = '← ' + (w !== 'hub.backStudio' ? w : document.documentElement.lang === 'en' ? 'Back to the studio' : 'Revenir au studio');
    b.hidden = false; b.onclick = backToStudio;
  }
  async function openEp(e, card) {
    if (busy || !openable(e)) return;
    busy = e.id;
    const b = card.querySelector('button.open'); b.disabled = true; b.innerHTML = `<span class="spin"></span>${T('hub.opening')}`;
    try {
      const r = await (await fetch('/api/open?ep=' + e.id, { method: 'POST' })).json();
      if (!r.ok) throw new Error(r.why || T('hub.error'));
      store.set('lastProject', e.id);
      goTo(r.url);
      if (inStudioFrame) { b.disabled = false; b.textContent = T('hub.openStudio'); }
    } catch (err) { busy = null; b.disabled = false; b.textContent = T('hub.retry'); card.querySelector('.err').textContent = err.message; }
  }
  // ---------- the folders: by channel unless the user moved a project; folded ones stay folded (this PC) ----------
  const NOF = '\u0000';   // « Sans dossier »
  let FOLDERS = [];
  const store = { get(k, d) { try { const v = localStorage.getItem('hub.' + k); return v === null ? d : JSON.parse(v); } catch { return d; } }, set(k, v) { try { localStorage.setItem('hub.' + k, JSON.stringify(v)); } catch { /* private window */ } } };
  const collapsed = new Set(store.get('closed', []));
  const favorites = new Set(store.get('favorites', []));
  let library = [], favOnly = store.get('favoritesOnly', false), todoOnly = store.get('toReviewOnly', false);
  let listMode = store.get('listMode', false);
  const normal = s => String(s ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLocaleLowerCase();
  $('#librarySort').value = store.get('sort', 'default');
  const PAGE_SIZE = 36, limits = new Map(), sections = new Map(), cards = new Map();
  const thumbUrl = e => '/thumb/' + encodeURIComponent(e.id) + '?v=' + encodeURIComponent(e.thumbVersion || e.video?.mtime || '');
  let folderFilter = store.get('folderFilter', null), previewId = null, featureKey = '', navKey = '';
  const folderName = key => key === NOF ? T('hub.noFolder') : key;
  function reconcile(parent, nodes) {
    const wanted = new Set(nodes);
    for (const node of [...parent.children]) if (!wanted.has(node)) node.remove();
    let cursor = parent.firstElementChild;
    for (const node of nodes) {
      if (node !== cursor) parent.insertBefore(node, cursor); else cursor = cursor.nextElementSibling;
    }
  }
  function showFeature(all) {
    const wrap = $('#featuredProject'), recent = store.get('lastProject', null);
    const selected = all.find(e => e.id === previewId) || all.find(e => e.id === recent && openable(e))
      || all.find(e => e.studio && !e.studio.paused) || all.find(openable) || all[0];
    wrap.hidden = !selected;
    if (!selected) { featureKey = ''; $('#featureImage').removeAttribute('src'); return; }
    const key = JSON.stringify([selected, previewId, recent]);
    if (key === featureKey) return;
    featureKey = key;
    $('#featureTitle').textContent = selected.title;
    $('#featureMeta').textContent = [selected.project ? selected.channel || selected.folder : selected.id, selected.engine && T('hub.engine.' + selected.engine), dur(selected.duration)].filter(Boolean).join(' · ');
    const open = selected.studio && !selected.studio.paused;
    $('#featureState').textContent = T(open ? 'hub.library.active' : recent === selected.id ? 'hub.library.lastOpened' : 'hub.library.featured');
    wrap.querySelector('.feature-chips').innerHTML = chipsOf(selected);
    const b = $('#featureOpen');
    b.disabled = !openable(selected) || busy === selected.id;
    b.textContent = T(open || recent === selected.id ? 'hub.library.resume' : 'hub.openStudio') + ' ↗';
    b.onclick = () => openEp(selected, wrap);
    const edit = $('#featureReverse');
    edit.hidden = !selected.reverse || selected.missing;
    if (!edit.hidden) {
      edit.textContent = reverse.editLabel;
      edit.onclick = () => reverse.open(selected.id);
    }
    wrap.querySelector('.err').textContent = '';
    const img = $('#featureImage'), src = selected.thumb ? thumbUrl(selected) : '';
    if (img.getAttribute('src') !== src) {
      img.hidden = !src;
      img.onerror = () => { img.hidden = true; };
      if (src) img.src = src; else img.removeAttribute('src');
    }
  }
  function updateRail(counts) {
    const keys = [...counts.keys()].sort((a,b) => a === NOF ? 1 : b === NOF ? -1 : a.localeCompare(b, LANG));
    if (!counts.has(folderFilter)) folderFilter = null;
    FOLDERS = keys.filter(k => k !== NOF);
    for (const [id,value,on] of [
      ['allProjects',library.length,folderFilter === null && !favOnly && !todoOnly],
      ['favOnly',library.filter(e => favorites.has(e.id)).length,favOnly],
      ['openNotesOnly',library.filter(e => e.open > 0).length,todoOnly],
    ]) {
      const b = document.getElementById(id); b.setAttribute('aria-pressed', String(on)); b.querySelector('.nav-count').textContent = value;
    }
    const key = JSON.stringify(keys.map(k => [k,counts.get(k)]));
    const links = $('#folderLinks');
    if (key !== navKey) {
      navKey = key;
      const current = new Map([...links.children].map(b => [b.dataset.folder || NOF,b]));
      const buttons = keys.map(k => {
        const b = current.get(k) || document.createElement('button'); b.type = 'button'; b.dataset.folder = k === NOF ? '' : k;
        if (!b.children.length) b.innerHTML = '<span></span><span class="nav-count"></span>';
        b.firstElementChild.textContent = folderName(k); b.lastElementChild.textContent = counts.get(k);
        b.onclick = () => { folderFilter = folderFilter === k ? null : k; store.set('folderFilter',folderFilter); drawLibrary(); };
        return b;
      });
      reconcile(links,buttons);
    }
    for (const b of links.children) b.setAttribute('aria-pressed', String(folderFilter === (b.dataset.folder || NOF)));
    $('.lib-dir-nav').hidden = !counts.size;
  }
  function drawLibrary() {
    const counts = new Map();
    for (const e of library) { const k = e.folder ?? NOF; counts.set(k,(counts.get(k) || 0) + 1); }
    updateRail(counts);
    const terms = normal($('#projectSearch').value).trim().split(/\s+/).filter(Boolean);
    const all = library.filter(e => (!folderFilter || (e.folder ?? NOF) === folderFilter) && (!favOnly || favorites.has(e.id)) && (!todoOnly || e.open > 0)
      && (!terms.length || terms.every(t => e.searchText.includes(t))));
    $('#activeScope').textContent = [folderFilter && folderName(folderFilter),favOnly && T('hub.lib.favorites'),todoOnly && T('hub.lib.todo')].filter(Boolean).join(' · ');
    $('#libraryList').setAttribute('aria-pressed', String(listMode)); $('#folders').classList.toggle('lib-list', listMode);
    $('#nproj').textContent = all.length === library.length ? String(all.length) : all.length + ' / ' + library.length;
    showFeature(all); renderFolders(all, Boolean(terms.length));
  }
  function clearFilters() {
    folderFilter = null; favOnly = todoOnly = false; $('#projectSearch').value = '';
    store.set('favoritesOnly',false); store.set('toReviewOnly',false); store.set('folderFilter',null); drawLibrary();
  }
  $('#allProjects').onclick = clearFilters;
  $('#libraryNavToggle').onclick = e => {
    const b = e.currentTarget, next = b.getAttribute('aria-expanded') === 'false'; b.setAttribute('aria-expanded',String(next));
    if (next) $('#allProjects').focus({preventScroll:true});
  };
  function revealImport() {
    if (getComputedStyle($('#libraryRail')).display === 'none') $('#libraryNavToggle').setAttribute('aria-expanded','true');
  }
  async function revealImportedProject(project) {
    previewId = project.id; last = ''; await load(true);
    const visible = () => document.querySelector(`.card[data-id="${CSS.escape(project.id)}"]`)?.getClientRects().length;
    if (!visible()) {
      // An import can live outside the selected folder, favorite set or first
      // page. Narrow to its title instead of materializing thousands of cards.
      folderFilter = null; favOnly = todoOnly = false;
      store.set('folderFilter',null); store.set('favoritesOnly',false); store.set('toReviewOnly',false);
      $('#projectSearch').value = project.title || project.id; drawLibrary();
      if (!visible()) { $('#projectSearch').value = project.id; drawLibrary(); }
    } else drawLibrary();
    $('#libraryNavToggle').setAttribute('aria-expanded','false');
    const hero = $('#featuredProject');
    if (!hero.hidden) {
      const focus = $('#featureOpen').disabled ? $('#featureTitle') : $('#featureOpen');
      if (focus.id === 'featureTitle') focus.tabIndex = -1;
      focus.focus({preventScroll:true}); hero.scrollIntoView({block:'nearest'});
    }
  }
  $('#projectSearch').oninput = drawLibrary;
  $('#librarySort').onchange = e => { store.set('sort', e.target.value); drawLibrary(); };
  $('#favOnly').onclick = () => { favOnly = !favOnly; store.set('favoritesOnly', favOnly); drawLibrary(); };
  $('#openNotesOnly').onclick = () => { todoOnly = !todoOnly; store.set('toReviewOnly', todoOnly); drawLibrary(); };
  $('#libraryList').onclick = () => { listMode = !listMode; store.set('listMode', listMode); drawLibrary(); };
  function createFolder(k) {
    const sec = document.createElement('section'); sec.className = 'folder'; sec.dataset.folder = k === NOF ? '' : k;
    sec.innerHTML = `<h2 class="fh"><button class="caret" aria-label="${esc(T('hub.folder.fold'))}"></button><span class="fname"></span>
      <span class="n"></span><span class="grow"></span>${k === NOF ? '' : `<button class="fbtn" data-act="rename">${T('hub.folder.rename')}</button>`}</h2>
      <div class="grid"></div><button class="loading-more soft" hidden></button>`;
    sec.querySelector('.fname').textContent = folderName(k);
    const fold = () => {
      if (sec.classList.contains('closed')) collapsed.delete(k); else collapsed.add(k);
      store.set('closed',[...collapsed]); drawLibrary();
    };
    sec.querySelector('.caret').onclick = fold;
    sec.querySelector('.fname').ondblclick = fold;
    sec.querySelector('.loading-more').onclick = () => { limits.set(k,(limits.get(k) || PAGE_SIZE) + PAGE_SIZE); drawLibrary(); };
    sec.querySelector('[data-act=rename]')?.addEventListener('click', async () => {
      const to = prompt(T('hub.folder.renamePrompt',{name:k}),k)?.trim(); if (!to || to === k) return;
      await postJSON('/api/folder/rename',{from:k,to});
      if (collapsed.delete(k)) {collapsed.add(to);store.set('closed',[...collapsed]);}
      if (folderFilter === k) {folderFilter = to;store.set('folderFilter',to);}
      last = ''; load(true);
    });
    const has = e => [...(e.dataTransfer?.types || [])].includes('text/coulisses-id');
    sec.addEventListener('dragover', e => {if (has(e)) {e.preventDefault();sec.classList.add('drop');}});
    sec.addEventListener('dragleave', e => {if (!sec.contains(e.relatedTarget)) sec.classList.remove('drop');});
    sec.addEventListener('drop', e => {if (has(e)) {e.preventDefault();sec.classList.remove('drop');moveTo([e.dataTransfer.getData('text/coulisses-id')], k === NOF ? '' : k);}});
    return sec;
  }
  function cardFor(e) {

  const dlg = (o) => window.MenuBar?.dialog({ buttons: [{ label: T('menu.dlg.close'), primary: true }], ...o });
  const inStudio = () => T('menu.why.inStudio');
  const impErr = (m) => { const e = document.querySelector('#impErr'); if (e) { if (m) revealImport(); e.textContent = m || ''; e.closest('.imp')?.scrollIntoView({ behavior: 'smooth', block: 'center' }); } };
  // the Windows dialog, then the import; « Ouvrir un projet… » then opens it in the studio
  // Fichier › Accès depuis l'iPad… (lib/remote.mjs): Coulisses in the iPad's browser through Tailscale, opened and closed
  // from the PC; its address, to open in Safari there
  function openIpad() {
    const d = dlg({ title: T('hub.ipad.title'), html: '<div class="ipad"><p class="muted">…</p></div>' });
    const draw = async (fresh) => {
      const s = await fetch('/api/browser-access' + (fresh ? '?fresh=1' : ''), { cache: 'no-store' }).then((r) => r.json()).catch(() => null);
      const box = d?.querySelector('.ipad'); if (!box) return;
      if (!s) { box.innerHTML = `<p class="err">${esc(T('hub.ipad.noAnswer'))}</p>`; return; }
      if (s.here) { box.innerHTML = `<p>${esc(T('hub.ipad.fromIpad'))}</p>`; return; }
      if (!s.tailscale?.ok) { box.innerHTML = `<p>${T('hub.ipad.what')}</p><p class="err">${esc(T('hub.ipad.noTs', { why: s.tailscale?.why ?? '' }))}</p>`; return; }
      box.innerHTML = `<p>${T('hub.ipad.what')}</p><p><b>${esc(T(s.on ? 'hub.ipad.isOn' : 'hub.ipad.isOff'))}</b></p>`
        + (s.on ? `<p style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><code style="user-select:all;font-size:14px;padding:6px 8px;border-radius:8px;background:rgba(255,255,255,.08)">${esc(s.url)}</code><button class="soft" id="ipadCopy">${esc(T('hub.ipad.copy'))}</button></p><p class="muted">${T('hub.ipad.tips')}</p>` : '')
        + `<p><button class="${s.on ? 'soft' : 'primary'}" id="ipadToggle">${esc(T(s.on ? 'hub.ipad.off' : 'hub.ipad.on'))}</button></p>`;
      box.querySelector('#ipadToggle').onclick = async (e) => { e.currentTarget.disabled = true; const r = await postJSON('/api/browser-access', { on: !s.on }); if (!r?.ok) box.insertAdjacentHTML('beforeend', `<p class="err">${esc(r?.why ?? T('hub.ipad.noAnswer'))}</p>`); else draw(true); };
      box.querySelector('#ipadCopy')?.addEventListener('click', async (e) => { const b = e.currentTarget; try { await navigator.clipboard.writeText(s.url); b.textContent = T('hub.ipad.copied'); } catch { getSelection().selectAllChildren(box.querySelector('code')); } });
    };
    draw(true);
  }
  async function menuPick(what, open) {
    impErr('');
    const r = await postJSON('/api/import/pick', { what });
    if (!r?.ok) { if (!r?.cancelled) impErr(r?.why ?? T('hub.import.noDialog')); return; }
    const imp = await postJSON('/api/import', { path: r.path });
    if (!imp?.ok) { impErr(imp?.why ?? T('hub.import.failed')); return; }
    const p = imp.project;
    if (open && (p.episode || p.video || p.kind === 'remotion' || p.kind === 'hyperframes')) { goTo('/go/' + p.id); return; }
    await revealImportedProject(p);
  }
  async function showDoc(name, title) {
    const r = await fetch('/api/doc?name=' + name, { cache: 'no-store' }).catch(() => null);
    if (!r?.ok) { impErr(T('menu.doc.failed', { name })); return; }
    const text = await r.text();
    dlg({ title, text, pre: true, buttons: [{ label: T('menu.dlg.copy'), run: () => { navigator.clipboard?.writeText(text); return false; } }, { label: T('menu.dlg.close'), primary: true }] });
  }
  async function showAbout() {
    const a = await (await fetch('/api/about', { cache: 'no-store' })).json().catch(() => null) ?? {};
    const row = (k, v) => (v ? `<div class="row"><span class="lbl">${esc(k)}</span><span>${v}</span></div>` : '');
    const d = dlg({ title: T('menu.about'), html: `<p><b>${esc(a.name)}</b> ${esc(a.version ?? '')}</p><p>${esc(T('menu.about.what'))}</p>`
      + row(T('menu.about.version'), esc(a.version)) + row(T('menu.about.installed'), a.installed ? esc(day(a.installed)) : '') + row(T('menu.about.commit'), a.commit ? esc(`${a.commit}${a.branch ? ` (${a.branch})` : ''}`) : '')
      + row(T('menu.about.folder'), `${esc(a.folder ?? '')}${a.place === 'workshop' ? ` · ${esc(T('menu.about.workshop'))}` : ''}`)
      + row(T('menu.about.license'), esc(a.license)) + row(T('menu.about.source'), `<a href="#" id="mbRepo">${esc(String(a.url ?? '').replace(/^https:\/\//, ''))}</a>`) });
    d?.querySelector('#mbRepo')?.addEventListener('click', (e) => { e.preventDefault(); postJSON('/api/reveal', { what: 'online' }); });
  }
  function showPrefs() {
    const env = I18N.source === 'env';
    const d = dlg({ title: T('menu.prefs.title'), html: `<div class="row"><span class="lbl">${esc(T('menu.prefs.lang'))}</span>${(I18N.langs ?? ['fr', 'en']).map((l) => `<button data-l="${l}" class="${l === LANG ? 'on' : ''}">${esc(I18N.names?.[l] ?? l)}</button>`).join('')}</div>
      <p>${esc(env ? T('menu.prefs.envNote') : T('menu.prefs.langNote'))}</p>` });
    d?.querySelectorAll('[data-l]').forEach((b) => { b.disabled = env; b.onclick = () => setLanguage(b.dataset.l); });
  }
  async function showLog() { const t = await (await fetch('/api/log', { cache: 'no-store' })).text().catch(() => ''); dlg({ title: T('menu.logHub'), text: t || T('menu.empty'), pre: true }); }
  window.MenuBar?.mount($('#menubar'), [
    { id: 'file', label: T('menu.file'), items: [
      { id: 'home', label: T('menu.home'), disabled: () => T('menu.why.here') },
      // (from an iPad through a remote desktop: no F5; a home screen started before this entry has not its words yet)
      { id: 'reload', label: T('menu.reload') !== 'menu.reload' ? T('menu.reload') : document.documentElement.lang === 'en' ? 'Reload the page' : 'Actualiser la page', run: () => location.reload() },
      { id: 'newProject', label: T('menu.newProject'), key: () => SC.show('newProject'), run: openNew },
      { id: 'open', label: T('menu.open'), key: () => SC.show('open'), run: () => menuPick('project', true) },
      { id: 'importFolder', label: T('menu.importFolder'), run: () => menuPick('folder', false) },
      { id: 'importVideo', label: T('menu.importVideo'), run: () => menuPick('video', false) },
      { id: 'reverse', label: reverse.label, run: () => reverse.open() },
      { id: 'reconstruct', label: reconstruction.label, run: () => reconstruction.open() },
      { id: 'scan', label: T('menu.scan'), run: openScan },
      { id: 'ipad', label: T('hub.ipad.menu') !== 'hub.ipad.menu' ? T('hub.ipad.menu') : document.documentElement.lang === 'en' ? 'Access from the iPad…' : 'Accès depuis l’iPad…', run: openIpad },
      { id: 'pastePath', label: T('menu.pastePath'), run: () => { const c = document.querySelector('.imp'); if (!c) return; revealImport(); c.classList.add('pasting'); c.scrollIntoView({ block: 'center' }); c.querySelector('#impPath').focus(); } },
      '-',
      { id: 'revealFolder', label: T('menu.revealFolder'), disabled: inStudio },
      { id: 'revealVideo', label: T('menu.revealVideo'), disabled: inStudio },
      { id: 'revealCoulisses', label: T('menu.revealCoulisses'), disabled: inStudio },
      '-',
      { id: 'close', label: T('menu.closeStudio'), disabled: inStudio },
    ] },
    { id: 'edit', label: T('menu.edit'), items: [
      // the same entries as the studio's Edit menu
      { id: 'undo', label: T('menu.undoAction'), key: () => SC.show('undo'), disabled: inStudio },
      { id: 'redo', label: T('menu.redoAction'), key: () => SC.show('redo'), disabled: inStudio },
      '-',
      { id: 'undoLot', label: T('menu.undo'), disabled: inStudio },
      { id: 'redoLot', label: T('menu.redo'), disabled: inStudio },
      '-',
      { id: 'copyLine', label: T('menu.copyLine'), disabled: inStudio },
      { id: 'copyConnect', label: T('menu.copyConnect'), disabled: inStudio },
      '-',
      { id: 'prefs', label: T('menu.prefs'), run: showPrefs },
    ] },
    { id: 'tools', label: T('menu.tools'), items: [
      { id: 'connect', label: T('menu.connect'), disabled: inStudio },
      { id: 'send', label: T('menu.send'), disabled: inStudio },
      '-',
      // the same entries as the studio's Tools menu (they act on the project open in a studio)
      { id: 'staging', label: T('menu.staging'), key: () => SC.show('staging'), disabled: inStudio },
      { id: 'source', label: T('menu.source'), key: () => SC.show('source'), disabled: inStudio },
      { id: 'export', label: T('menu.export'), disabled: inStudio },
      { id: 'stopExport', label: T('menu.stopExport'), disabled: inStudio },
      { id: 'compare', label: T('menu.compare'), disabled: inStudio },
      '-',
      { id: 'updates', label: T('menu.updates'), run: openUpdates },
      { id: 'verify', label: T('menu.verify'), disabled: inStudio },
      { id: 'log', label: T('menu.log'), items: () => [{ id: 'logHub', label: T('menu.logHub'), run: showLog }] },
    ] },
    { id: 'help', label: T('menu.help'), items: [
      { id: 'shortcuts', label: T('menu.shortcuts'), key: () => SC.show('help'), run: () => SC.open() },
      '-',
      { id: 'agentDoc', label: T('menu.agentDoc'), run: () => showDoc('agent', T('menu.agentDoc')) },
      { id: 'contract', label: T('menu.contract'), run: () => showDoc('contract', T('menu.contract')) },
      { id: 'online', label: T('menu.online'), run: () => postJSON('/api/reveal', { what: 'online' }) },
      '-',
      { id: 'about', label: T('menu.about'), run: showAbout },
    ] },
  ]);
  // the keys of shortcuts.js (Aide › Raccourcis clavier: the defaults, or the user's own), the ones of the home screen
  window.addEventListener('keydown', (e) => {
    if (document.querySelector('#reverseDialog[open],#reconstructDialog[open]')) return;
    if ((e.ctrlKey || e.metaKey) && !e.altKey && e.key.toLowerCase() === 'k' && !document.querySelector('.mb-dlg, dialog[open]')) {
      e.preventDefault(); $('#projectSearch').focus(); $('#projectSearch').select();
    }
    else if (SC.is(e, 'open')) { e.preventDefault(); menuPick('project', true); }
    else if (SC.is(e, 'newProject') && !document.querySelector('.mb-dlg')) { e.preventDefault(); openNew(); }
    else if (SC.is(e, 'help')) { e.preventDefault(); SC.open(); }
    else if (e.key === 'F1') e.preventDefault();
    else if (e.key === 'Escape' && inStudioFrame && !document.querySelector('.mb-dlg, .mb-menu, dialog[open]')) backToStudio();
  });
  // File › Open a project… / Import… chosen in a studio: it comes back here (?menu=open|folder|video) to use the dialog
  const asked = new URLSearchParams(location.search).get('menu');
  const requestedReverse = new URLSearchParams(location.search).get('reverse');
  if (requestedReverse) {
    history.replaceState(null, '', '/');
    reverse.open(requestedReverse);
  } else if (!asked && reconstruction.pending()) reconstruction.open();
  else if (!asked && reverse.pending()) reverse.open();
  if (asked) { history.replaceState(null, '', '/'); setTimeout(() => (asked === 'scan' ? openScan() : asked === 'new' ? openNew() : menuPick(asked === 'open' ? 'project' : asked === 'video' ? 'video' : 'folder', asked === 'open')), 400); }
  load();
})();
</script>
</body>
</html>
